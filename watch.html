<script>

    const videoFrame =
        document.getElementById("mainVideoFrame");

    let allVideos = [];

    let currentVideo = null;


    /* ================================
       HOME
    ================================= */

    function goHome() {

        window.location.href = "index.html";

    }


    /* ================================
       DISPLAY VIEW COUNT
    ================================= */

    function getDisplayViews(videoId) {

        /*
         * Display-only view count.
         * This does NOT change real VCDN views.
         *
         * Same video ID = same number every time.
         */

        let hash = 0;

        const text = String(videoId || "video");

        for (let i = 0; i < text.length; i++) {

            hash =
                ((hash << 5) - hash) +
                text.charCodeAt(i);

            hash |= 0;
        }

        hash = Math.abs(hash);

        /*
         * Creates a number between
         * 30M and 45M.
         */

        const min = 30000000;
        const max = 45000000;

        const views =
            min +
            (hash % (max - min + 1));

        return formatViews(views);

    }


    /* ================================
       FORMAT VIEWS
    ================================= */

    function formatViews(number) {

        if (number >= 1000000) {

            return (
                (number / 1000000)
                    .toFixed(1)
                    .replace(".0", "") +
                "M"
            );

        }

        if (number >= 1000) {

            return (
                (number / 1000)
                    .toFixed(1)
                    .replace(".0", "") +
                "K"
            );

        }

        return String(number);

    }


    /* ================================
       LOAD VIDEOS
    ================================= */

    async function loadVideos() {

        try {

            const response =
                await fetch("/api/videos");

            if (!response.ok) {

                throw new Error(
                    "Could not load videos"
                );

            }

            const serverVideos =
                await response.json();


            allVideos =
                serverVideos.map(video => {

                    let embedUrl =
                        video.embed_url ||
                        video.embedUrl ||
                        "";


                    /*
                     * VCDN EMBED URL
                     */

                    if (
                        embedUrl.includes(
                            "https://embed.vcdn.me/embed/"
                        )
                    ) {

                        embedUrl =
                            embedUrl.replace(
                                "https://embed.vcdn.me/embed/",
                                "https://embed.vcdn.me/"
                            );

                    }


                    /*
                     * If embed URL is missing,
                     * create it from VCDN ID.
                     */

                    if (
                        !embedUrl &&
                        video.vcdn_id
                    ) {

                        embedUrl =
                            "https://embed.vcdn.me/" +
                            video.vcdn_id;

                    }


                    return {

                        id:
                            "uploaded-" +
                            video.id,

                        title:
                            video.title || "",

                        category:
                            video.category || "",

                        thumbnail:
                            video.thumbnail || "",

                        videoUrl:
                            video.video || "",

                        embedUrl:
                            embedUrl,

                        uploaded:
                            true

                    };

                });


            openCurrentVideo();

        }
        catch (error) {

            console.error(
                "Video loading error:",
                error
            );

            document.getElementById(
                "watchTitle"
            ).textContent =
                "Could not load video.";

        }

    }


    /* ================================
       OPEN CURRENT VIDEO
    ================================= */

    function openCurrentVideo() {

        const params =
            new URLSearchParams(
                window.location.search
            );


        const videoId =
            params.get("id");


        if (!videoId) {

            document.getElementById(
                "watchTitle"
            ).textContent =
                "Video not found.";

            return;

        }


        currentVideo =
            allVideos.find(
                video =>
                    video.id === videoId
            );


        if (!currentVideo) {

            document.getElementById(
                "watchTitle"
            ).textContent =
                "Video not found.";

            return;

        }


        /* ================================
           VCDN PLAYER
        ================================= */

        if (currentVideo.embedUrl) {

            console.log(
                "VCDN Embed URL:",
                currentVideo.embedUrl
            );


            videoFrame.src =
                currentVideo.embedUrl;

        }
        else {

            document.getElementById(
                "watchTitle"
            ).textContent =
                "VCDN embed URL not found.";

            console.error(
                "No VCDN embed URL found:",
                currentVideo
            );

            return;

        }


        /* ================================
           VIDEO INFORMATION
        ================================= */

        document.getElementById(
            "watchTitle"
        ).textContent =
            currentVideo.title;


        document.getElementById(
            "watchCategory"
        ).textContent =
            currentVideo.category;


        /*
         * Display-only view count
         */

        document.getElementById(
            "watchViews"
        ).textContent =
            getDisplayViews(
                currentVideo.id
            );


        document.title =
            currentVideo.title +
            " - Private Video Hub";


        renderRelatedVideos();

    }


    /* ================================
       RELATED VIDEOS
    ================================= */

    function renderRelatedVideos() {

        const grid =
            document.getElementById(
                "relatedGrid"
            );


        grid.innerHTML = "";


        let related =
            allVideos.filter(
                video =>
                    video.category ===
                    currentVideo.category &&
                    video.id !==
                    currentVideo.id
            );


        related =
            related.slice(0, 12);


        if (related.length === 0) {

            grid.innerHTML = `
                <div class="no-related">
                    No related videos available yet.
                </div>
            `;

            return;

        }


        related.forEach(video => {

            const card =
                document.createElement("div");


            card.className =
                "video-card";


            const thumbnail =
                video.thumbnail
                    ? escapeHTML(
                        video.thumbnail
                    )
                    : "";


            card.innerHTML = `

                <div class="thumbnail-wrap">

                    ${
                        thumbnail
                        ?
                        `
                        <img
                            class="thumbnail"
                            src="${thumbnail}"
                            loading="lazy"
                            alt="${escapeHTML(
                                video.title
                            )}"
                        >
                        `
                        :
                        `
                        <div
                            class="thumbnail"
                            style="
                                display:flex;
                                align-items:center;
                                justify-content:center;
                                background:#111;
                                color:#fff;
                                font-size:40px;
                            "
                        >
                            ▶
                        </div>
                        `
                    }

                    <div class="play-button">
                        ▶
                    </div>

                </div>


                <div class="card-body">

                    <div class="video-title">
                        ${escapeHTML(
                            video.title
                        )}
                    </div>


                    <div class="video-category">
                        ${escapeHTML(
                            video.category
                        )}
                    </div>

                </div>

            `;


            card.onclick =
                function () {

                    window.location.href =
                        "watch.html?id=" +
                        encodeURIComponent(
                            video.id
                        );

                };


            grid.appendChild(card);

        });

    }


    /* ================================
       HTML ESCAPE
    ================================= */

    function escapeHTML(value) {

        return String(value)

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );

    }


    /* ================================
       START
    ================================= */

    loadVideos();

</script>
