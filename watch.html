<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            padding: 10px 16px;
            background: #222;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-btn:hover {
            background: #333;
        }

        .video-box {
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        #mainVideoFrame {
            display: block;
            width: 100%;
            height: 75vh;
            min-height: 400px;
            border: none;
            background: #000;
        }

        .video-info {
            padding: 18px 0;
        }

        .video-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .video-category {
            color: #aaa;
            font-size: 15px;
        }

        .related-title {
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 22px;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .related-card {
            background: #151515;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
        }

        .related-card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            display: block;
            background: #222;
        }

        .related-card-title {
            padding: 10px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message {
            text-align: center;
            padding: 50px 20px;
            color: #aaa;
        }

        @media (max-width: 700px) {
            .container {
                padding: 10px;
            }

            #mainVideoFrame {
                height: 55vh;
                min-height: 250px;
            }

            .video-title {
                font-size: 19px;
            }

            .related-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .related-card img {
                height: 100px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a href="index.html" class="back-btn">← Back</a>

    <div class="video-box">
        <iframe
            id="mainVideoFrame"
            src=""
            title="Video Player"
            allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
            allowfullscreen
            referrerpolicy="no-referrer">
        </iframe>
    </div>

    <div class="video-info">
        <div id="videoTitle" class="video-title">Loading...</div>
        <div id="videoCategory" class="video-category"></div>
    </div>

    <div id="relatedSection">
        <div class="related-title">Related Videos</div>
        <div id="relatedVideos" class="related-grid"></div>
    </div>

</div>

<script>

    // ==============================
    // LOGIN CHECK
    // ==============================

    if (sessionStorage.getItem("videoAuth") !== "true") {
        window.location.href = "login.html";
    }


    // ==============================
    // VARIABLES
    // ==============================

    const videoFrame = document.getElementById("mainVideoFrame");
    const videoTitle = document.getElementById("videoTitle");
    const videoCategory = document.getElementById("videoCategory");
    const relatedVideos = document.getElementById("relatedVideos");

    let videos = [];
    let currentVideo = null;


    // ==============================
    // GET VIDEO ID
    // ==============================

    const params = new URLSearchParams(window.location.search);
    const requestedId = params.get("id");


    // ==============================
    // VCDN URL
    // ==============================

    function createVcdnUrl(video) {

        if (!video) {
            return "";
        }

        // Use exact VCDN embed URL from server
        if (video.embed_url) {

            return video.embed_url
                .replace(
                    "https://embed.vcdn.me/embed/",
                    "https://embed.vcdn.me/"
                );
        }

        if (video.embedUrl) {

            return video.embedUrl
                .replace(
                    "https://embed.vcdn.me/embed/",
                    "https://embed.vcdn.me/"
                );
        }

        // VCDN video ID fallback
        if (video.vcdn_id) {

            return "https://embed.vcdn.me/" +
                   video.vcdn_id;
        }

        // Normal video fallback
        if (video.video) {
            return video.video;
        }

        if (video.videoUrl) {
            return video.videoUrl;
        }

        return "";
    }


    // ==============================
    // OPEN VIDEO
    // ==============================

    function openCurrentVideo() {

        if (!currentVideo) {

            videoTitle.textContent =
                "Video not found";

            return;
        }

        videoTitle.textContent =
            currentVideo.title ||
            "Untitled Video";

        videoCategory.textContent =
            currentVideo.category ||
            "";

        const playerUrl =
            createVcdnUrl(currentVideo);

        if (!playerUrl) {

            videoFrame.removeAttribute("src");

            videoTitle.textContent =
                "Video URL not found";

            return;
        }

        console.log(
            "VIDEO PLAYER URL:",
            playerUrl
        );

        videoFrame.src = playerUrl;
    }


    // ==============================
    // LOAD RELATED VIDEOS
    // ==============================

    function loadRelatedVideos() {

        relatedVideos.innerHTML = "";

        if (
            !currentVideo ||
            videos.length === 0
        ) {
            return;
        }

        const related =
            videos
                .filter(video =>
                    String(video.id) !==
                    String(currentVideo.id)
                )
                .slice(0, 12);

        related.forEach(video => {

            const card =
                document.createElement("div");

            card.className =
                "related-card";

            const thumbnail =
                video.thumbnail ||
                video.thumbnailUrl ||
                "";

            const title =
                video.title ||
                "Untitled Video";

            card.innerHTML = `
                <img
                    src="${escapeHTML(thumbnail)}"
                    alt="${escapeHTML(title)}"
                    onerror="this.style.display='none'"
                >

                <div class="related-card-title">
                    ${escapeHTML(title)}
                </div>
            `;

            card.addEventListener(
                "click",
                function () {

                    const id =
                        "uploaded-" +
                        video.id;

                    window.location.href =
                        "watch.html?id=" +
                        encodeURIComponent(id);
                }
            );

            relatedVideos.appendChild(card);
        });
    }


    // ==============================
    // LOAD VIDEOS
    // ==============================

    async function loadVideos() {

        try {

            const response =
                await fetch("/api/videos");

            if (!response.ok) {

                throw new Error(
                    "Failed to load videos: " +
                    response.status
                );
            }

            const data =
                await response.json();

            videos =
                Array.isArray(data)
                    ? data
                    : [];

            console.log(
                "VIDEOS:",
                videos
            );


            // ==============================
            // CONVERT SERVER VIDEOS
            // ==============================

            videos =
                videos.map(video => {

                    const mapped = {

                        ...video,

                        id:
                            video.id,

                        title:
                            video.title ||
                            "Untitled Video",

                        category:
                            video.category ||
                            "Uncategorized",

                        thumbnail:
                            video.thumbnail ||
                            video.thumbnail_url ||
                            video.poster_url ||
                            "",

                        videoUrl:
                            video.video ||
                            video.videoUrl ||
                            "",

                        embedUrl:
                            video.embed_url ||
                            video.embedUrl ||
                            "",

                        playbackUrl:
                            video.playback_url ||
                            video.playbackUrl ||
                            "",

                        vcdn_id:
                            video.vcdn_id ||
                            ""
                    };


                    // ==============================
                    // CREATE VCDN URL
                    // WITHOUT /embed/
                    // ==============================

                    if (
                        !mapped.embedUrl &&
                        mapped.vcdn_id
                    ) {

                        mapped.embedUrl =
                            "https://embed.vcdn.me/" +
                            mapped.vcdn_id;
                    }

                    else if (
                        mapped.embedUrl
                    ) {

                        mapped.embedUrl =
                            mapped.embedUrl.replace(
                                "https://embed.vcdn.me/embed/",
                                "https://embed.vcdn.me/"
                            );
                    }

                    return mapped;
                });


            console.log(
                "PROCESSED VIDEOS:",
                videos
            );


            // ==============================
            // FIND REQUESTED VIDEO
            // ==============================

            currentVideo =
                videos.find(video => {

                    const normalId =
                        String(video.id);

                    const uploadedId =
                        "uploaded-" +
                        normalId;

                    return (

                        normalId ===
                        String(requestedId)

                        ||

                        uploadedId ===
                        String(requestedId)

                        ||

                        String(video.vcdn_id) ===
                        String(requestedId)
                    );
                });


            if (!currentVideo) {

                document.querySelector(
                    ".video-box"
                ).innerHTML =
                    `<div class="message">
                        Video not found.
                    </div>`;

                videoTitle.textContent =
                    "Video not found";

                return;
            }


            // ==============================
            // OPEN CURRENT VIDEO
            // ==============================

            openCurrentVideo();


            // ==============================
            // RELATED VIDEOS
            // ==============================

            loadRelatedVideos();

        }

        catch (error) {

            console.error(
                "LOAD VIDEO ERROR:",
                error
            );

            videoTitle.textContent =
                "Could not load videos";

            videoCategory.textContent =
                error.message || "";
        }
    }


    // ==============================
    // ESCAPE HTML
    // ==============================

    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );
    }


    // ==============================
    // START
    // ==============================

    document.addEventListener(
        "DOMContentLoaded",
        loadVideos
    );

</script>

</body>
</html>
```
