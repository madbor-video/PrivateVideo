<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Watch Video - Private Video Hub</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .watch-player {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
            border-radius: 12px;
        }

        .watch-player iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .watch-views {
            margin-top: 10px;
            font-size: 14px;
            color: #999;
        }

        .watch-views strong {
            color: #fff;
            font-weight: 600;
        }

    </style>

</head>

<body>

<!-- LOGIN PROTECTION -->

<script>

    if (
        sessionStorage.getItem("videoAuth") !== "true"
    ) {

        window.location.href = "login.html";

    }

</script>


<!-- HEADER -->

<header class="top-header">

    <div class="logo">
        PRIVATE<span>VIDEO</span>
    </div>

    <button
        onclick="goHome()"
        class="logout-btn"
    >
        ← Back
    </button>

</header>


<!-- WATCH PAGE -->

<main class="watch-main">

    <section class="watch-player-section">

        <div class="watch-player">

            <iframe
                id="mainVideoFrame"
                src=""
                title="Video Player"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>

        </div>


        <div class="watch-info">

            <h1 id="watchTitle">
                Loading video...
            </h1>

            <div
                id="watchCategory"
                class="watch-category"
            ></div>

            <div class="watch-views">

                <strong id="watchViews">
                    0
                </strong>

                Views

            </div>

        </div>

    </section>


    <!-- RELATED VIDEOS -->

    <section class="related-section">

        <div class="related-heading">

            <small>
                VIDEO COLLECTION
            </small>

            <h2>
                Related Videos
            </h2>

        </div>

        <div
            id="relatedGrid"
            class="video-grid"
        ></div>

    </section>

</main>


<!-- FOOTER -->

<footer>

    <div class="footer-logo">
        PRIVATE VIDEO
    </div>

    <p>
        Private video collection.
    </p>

    <p class="copyright">
        © 2026 Private Video Hub. All rights reserved.
    </p>

</footer>


<script>

    const videoFrame =
        document.getElementById(
            "mainVideoFrame"
        );


    let allVideos = [];

    let currentVideo = null;


    /* =====================================
       HOME
    ===================================== */

    function goHome() {

        window.location.href =
            "index.html";

    }


    /* =====================================
       VIEWS
    ===================================== */

    function getDisplayViews(videoId) {

        let hash = 0;

        const text =
            String(
                videoId || "video"
            );


        for (
            let i = 0;
            i < text.length;
            i++
        ) {

            hash =
                (
                    (hash << 5) -
                    hash
                ) +
                text.charCodeAt(i);

            hash |= 0;

        }


        hash =
            Math.abs(hash);


        const min =
            30000000;

        const max =
            45000000;


        const views =
            min +
            (
                hash %
                (
                    max -
                    min +
                    1
                )
            );


        return formatViews(
            views
        );

    }


    /* =====================================
       FORMAT VIEWS
    ===================================== */

    function formatViews(number) {

        if (number >= 1000000) {

            return (
                (number / 1000000)
                    .toFixed(1)
                    .replace(".0", "") +
                "M"
            );

        }


        if (number >= 1000) {

            return (
                (number / 1000)
                    .toFixed(1)
                    .replace(".0", "") +
                "K"
            );

        }


        return String(number);

    }


    /* =====================================
       CREATE VCDN URL
    ===================================== */

    function createVcdnUrl(video) {

        /*
         * সবসময় vcdn_id-কে priority দেওয়া হচ্ছে।
         *
         * Correct VCDN format:
         *
         * https://embed.vcdn.me/VIDEO_ID
         *
         * Wrong old format:
         *
         * https://embed.vcdn.me/embed/VIDEO_ID
         */


        if (video.vcdn_id) {

            return (
                "https://embed.vcdn.me/" +
                video.vcdn_id
            );

        }


        let url =
            video.embed_url ||
            video.embedUrl ||
            video.video ||
            "";


        if (
            url.includes(
                "https://embed.vcdn.me/embed/"
            )
        ) {

            url =
                url.replace(
                    "https://embed.vcdn.me/embed/",
                    "https://embed.vcdn.me/"
                );

        }


        return url;

    }


    /* =====================================
       LOAD VIDEOS
    ===================================== */

    async function loadVideos() {

        try {

            const response =
                await fetch(
                    "/api/videos",
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Could not load videos"
                );

            }


            const serverVideos =
                await response.json();


            allVideos =
                serverVideos.map(
                    video => {

                        return {

                            id:
                                "uploaded-" +
                                video.id,

                            title:
                                video.title ||
                                "Untitled Video",

                            category:
                                video.category ||
                                "",

                            thumbnail:
                                video.thumbnail ||
                                "",

                            videoUrl:
                                video.video ||
                                "",

                            embedUrl:
                                createVcdnUrl(
                                    video
                                ),

                            vcdnId:
                                video.vcdn_id ||
                                "",

                            uploaded:
                                true

                        };

                    }
                );


            console.log(
                "Loaded videos:",
                allVideos
            );


            openCurrentVideo();

        }
        catch (error) {

            console.error(
                "Video loading error:",
                error
            );


            document.getElementById(
                "watchTitle"
            ).textContent =
                "Could not load video.";

        }

    }


    /* =====================================
       OPEN CURRENT VIDEO
    ===================================== */

    function openCurrentVideo() {

        const params =
            new URLSearchParams(
                window.location.search
            );


        const videoId =
            params.get("id");


        console.log(
            "Requested video ID:",
            videoId
        );


        if (!videoId) {

            document.getElementById(
                "watchTitle"
            ).textContent =
                "Video not found.";

            return;

        }


        currentVideo =
            allVideos.find(
                video =>
                    video.id === videoId
            );


        console.log(
            "Current video:",
            currentVideo
        );


        if (!currentVideo) {

            document.getElementById(
                "watchTitle"
            ).textContent =
                "Video not found.";

            return;

        }


        /* =================================
           VCDN PLAYER
        ================================= */


        const playerUrl =
            currentVideo.embedUrl;


        console.log(
            "FINAL VCDN PLAYER URL:",
            playerUrl
        );


        if (!playerUrl) {

            document.getElementById(
                "watchTitle"
            ).textContent =
                "VCDN player URL not found.";

            return;

        }


        /*
         * iframe-এ শুধু correct VCDN URL যাবে।
         */

        videoFrame.src =
            playerUrl;


        /* =================================
           VIDEO INFORMATION
        ================================= */


        document.getElementById(
            "watchTitle"
        ).textContent =
            currentVideo.title;


        document.getElementById(
            "watchCategory"
        ).textContent =
            currentVideo.category;


        document.getElementById(
            "watchViews"
        ).textContent =
            getDisplayViews(
                currentVideo.id
            );


        document.title =
            currentVideo.title +
            " - Private Video Hub";


        renderRelatedVideos();

    }


    /* =====================================
       RELATED VIDEOS
    ===================================== */

    function renderRelatedVideos() {

        const grid =
            document.getElementById(
                "relatedGrid"
            );


        if (
            !grid ||
            !currentVideo
        ) {

            return;

        }


        grid.innerHTML = "";


        let related =
            allVideos.filter(
                video =>
                    video.category ===
                        currentVideo.category &&
                    video.id !==
                        currentVideo.id
            );


        related =
            related.slice(
                0,
                12
            );


        if (
            related.length === 0
        ) {

            grid.innerHTML = `

                <div class="no-related">

                    No related videos available yet.

                </div>

            `;

            return;

        }


        related.forEach(
            video => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "video-card";


                const thumbnail =
                    video.thumbnail
                        ? escapeHTML(
                            video.thumbnail
                        )
                        : "";


                card.innerHTML = `

                    <div class="thumbnail-wrap">

                        ${
                            thumbnail
                            ?
                            `
                            <img
                                class="thumbnail"
                                src="${thumbnail}"
                                loading="lazy"
                                alt="${escapeHTML(
                                    video.title
                                )}"
                            >
                            `
                            :
                            `
                            <div
                                class="thumbnail"
                                style="
                                    display:flex;
                                    align-items:center;
                                    justify-content:center;
                                    background:#111;
                                    color:#fff;
                                    font-size:40px;
                                "
                            >
                                ▶
                            </div>
                            `
                        }

                        <div class="play-button">
                            ▶
                        </div>

                    </div>


                    <div class="card-body">

                        <div class="video-title">
                            ${escapeHTML(
                                video.title
                            )}
                        </div>


                        <div class="video-category">
                            ${escapeHTML(
                                video.category
                            )}
                        </div>

                    </div>

                `;


                card.onclick =
                    function () {

                        window.location.href =
                            "watch.html?id=" +
                            encodeURIComponent(
                                video.id
                            );

                    };


                grid.appendChild(
                    card
                );

            }
        );

    }


    /* =====================================
       HTML ESCAPE
    ===================================== */

    function escapeHTML(value) {

        return String(value)

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );

    }


    /* =====================================
       START
    ===================================== */

    loadVideos();

</script>

</body>

</html>
